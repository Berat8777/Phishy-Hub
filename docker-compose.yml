version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: phishy_postgres
    restart: always
    environment:
      POSTGRES_USER: phishy_user
      POSTGRES_PASSWORD: phishy_password
      POSTGRES_DB: phishy_hub
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: phishy_minio
    restart: always
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password123
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data: